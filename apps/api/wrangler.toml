name = "chitai-live-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 生產環境配置
[env.production]
name = "chitai-live-api"
vars = { 
  ENVIRONMENT = "production",
  JWT_ISSUER = "chitai-live",
  JWT_AUDIENCE = "chitai-live-web"
}

# D1 資料庫綁定 (chitai-live)
[[env.production.d1_databases]]
binding = "DB"
database_name = "chitai-live"
database_id = "68a121de-5a7f-4ab4-b08c-216af1a57f8c"

# Workers KV 命名空間 (chitai-live-kv)
[[env.production.kv_namespaces]]
binding = "KV"
id = "8c2d769d055c4e45b516a125865fa214"
preview_id = "3bd5193cc4d54556b42619862c720aef"

# 預覽環境
[env.preview]
name = "chitai-live-api-preview"
vars = { ENVIRONMENT = "preview" }

# D1 資料庫綁定 (預覽)
[[env.preview.d1_databases]]
binding = "DB"
database_name = "chitai-live"
database_id = "68a121de-5a7f-4ab4-b08c-216af1a57f8c"

# Workers KV 命名空間 (預覽)
[[env.preview.kv_namespaces]]
binding = "KV"
id = "8c2d769d055c4e45b516a125865fa214"
preview_id = "3bd5193cc4d54556b42619862c720aef"