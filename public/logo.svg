<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 熾熱漸層：橙紅火焰感 -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="50%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <!-- 發光濾鏡 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 內發光 -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圓：深色舞台感 -->
  <circle cx="64" cy="64" r="60" fill="#0d0d0d" stroke="url(#fireGrad)" stroke-width="2"/>

  <!-- 「熾」字：主視覺 -->
  <text x="64" y="82" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif"
        font-size="56" font-weight="800" fill="url(#fireGrad)" filter="url(#glow)">
    熾
  </text>

  <!-- 底部 CHITAI 字標 -->
  <text x="64" y="108" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.15em"
        fill="#ffcc00" opacity="0.9" filter="url(#innerGlow)">
    CHITAI
  </text>

  <!-- 右上角 LIVE 指示燈：脈動動畫 -->
  <circle cx="100" cy="28" r="6" fill="#ff3300" opacity="0.9">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="31" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#fff" opacity="0.9">
    LIVE
  </text>

  <!-- 左上角 台 字小標：呼應品牌名 -->
  <text x="28" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700"
        fill="url(#fireGrad)" opacity="0.7">
    台
  </text>
</svg>